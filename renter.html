<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([22.7196,75.8577],12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

L.marker([22.7196,75.8577])

.addTo(map)
.bindPopup("Sample Property");
async function loadProperties() {

  const propertyList =
  document.getElementById("propertyList");

  propertyList.innerHTML = "";

  const snapshot =
  await db.collection("properties").get();

  snapshot.forEach(doc => {

    const data = doc.data();

    propertyList.innerHTML += `

      <div class="property-card">

        <img src="${data.imageUrl}" alt="Property">

        <div class="property-content">

          <h3>${data.propertyType}</h3>

          <p>📍 ${data.location}</p>

          <p>🪑 ${data.furnished}</p>

          <div class="price">
            ₹${data.price}/month
          </div>

        </div>

      </div>

    `;

  });

}

loadProperties();

</script>
