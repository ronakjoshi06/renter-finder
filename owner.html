<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Form – Find Your Dream Home or List Yours</title>
<style>
  body {
    font-family: 'Montserrat', sans-serif;
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 50px 0;
  }


  .form-container {
    background: #fff;
    width: 500px;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }

  /* Bubble Stepper */
  .steps {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
    position: relative;
  }

  .steps::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 25px;
    right: 25px;
    height: 4px;
    background: #ddd;
    z-index: 0;
  }

  .step {
    position: relative;
    z-index: 1;
    background: #ddd;
    color: #fff;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .step.active {
    background: #4a90e2;
  }

  .step-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 14px;
  }

  /* Form Fields */
  .form-step {
    display: none;
    flex-direction: column;
  }

  .form-step.active {
    display: flex;
  }

  .form-step input, .form-step select {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .form-step button {
    padding: 12px;
    background: #4a90e2;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .form-step button:hover {
    background: #357abd;
  }
</style>
</head>
<body>

<div class="form-container">
  <h2 style="text-align:center;">Find Your Dream Home or List Yours</h2>

  <!-- Bubble Steps -->
  <div class="steps">
    <div class="step active" data-step="1">1</div>
    <div class="step" data-step="2">2</div>
    <div class="step" data-step="3">3</div>
  </div>
  <div class="step-labels">
    <span>Owner Info</span>
    <span>Property Details</span>
    <span>Confirm</span>
  </div>

  <!-- Form Steps -->
  <form id="ownerForm">
    <!-- Step 1: Owner Info -->
    <div class="form-step active" data-step="1">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>
      <button type="button" onclick="nextStep()">Next</button>
    </div>

<!-- Step 2: Property Details -->
<div class="form-step" data-step="2">

  <input type="text" name="city" placeholder="City" required>

  <input type="text" name="area" placeholder="Area / Locality" required>

  <input type="text" name="location" placeholder="Full Address" required>

  <select name="propertyType">
    <option value="">Select Property Type</option>
    <option value="1BHK">1BHK</option>
    <option value="2BHK">2BHK</option>
    <option value="3BHK">3BHK</option>
    <option value="Villa">Villa</option>
    <option value="Room">Room</option>
  </select>

  <input type="number" name="price" placeholder="Rent Price" required>

  <select name="furnished">
    <option value="">Furnished?</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <input type="date" name="availableFrom">

  <label>Upload Property Image</label>

  <input
type="file"
id="propertyImage"
name="image"
accept="image/*">
  

  <button type="button" onclick="prevStep()">Back</button>
  <button type="button" onclick="nextStep()">Next</button>

</div>

    <!-- Step 3: Confirm -->
    <div class="form-step" data-step="3">
      <h3>Confirm Your Details</h3>
      <p>Check everything before submitting.</p>
      <button type="button" onclick="prevStep()">Back</button>
      <button type="submit">Submit</button>
    </div>
  </form>

</div>

<script>
  const steps = document.querySelectorAll('.step');
  const formSteps = document.querySelectorAll('.form-step');
  let currentStep = 0;

  function showStep(step) {
    formSteps.forEach((form, index) => {
      form.classList.toggle('active', index === step);
      steps[index].classList.toggle('active', index <= step);
    });
  }

  function nextStep() {
    if(currentStep < formSteps.length - 1){
      currentStep++;
      showStep(currentStep);
    }
  }

  function prevStep() {
    if(currentStep > 0){
      currentStep--;
      showStep(currentStep);
    }
  }
</script>
<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    // Agar login nahi hai → login page pe bhej do
    window.location.href = "owner-login.html";
  }
})

</script>

<script type="module" src="owner.html.js"></script>

</body>
</html>
